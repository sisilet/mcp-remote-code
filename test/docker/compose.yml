services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    ports:
      - "2222:2222"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"
      USER_NAME: test
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: testpass
    volumes:
      - ./init-fixture.sh:/custom-cont-init.d/init-fixture.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
